<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NHẬU ONLINE</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#10131d;
color:white;
text-align:center;
}
header{
padding:25px;
background:#191d2b;
border-bottom:2px solid #d6a34a;
}
h1{color:#e7b75b;font-size:35px}
.subtitle{color:#ccc}
.container{padding:30px 15px}
.rooms{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
max-width:950px;
margin:30px auto;
}
.room{
background:#22283a;
padding:25px;
border-radius:15px;
border:1px solid #4b5268;
}
.room h2{color:#f3c66b}
button{
background:#d6a34a;
color:#171717;
border:0;
padding:13px 25px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}
footer{padding:25px;color:#999}
</style>
</head>
<body>
<header>
<h1>🍻 NHẬU ONLINE</h1>
<p class="subtitle">Kết nối bạn bè - Cùng nhau vui vẻ</p>
</header>
<div class="container">
<h2>Chào mừng đến với thế giới NHẬU ONLINE</h2>
<p>Chọn không gian của bạn</p>
<div class="rooms">
<div class="room">
<h2>🍺 Phòng cộng đồng</h2>
<p>Gặp gỡ và kết nối bạn bè</p>
<button onclick="joinRoom('Cộng đồng')">Tham gia</button>
</div>
<div class="room">
<h2>🥂 Phòng riêng</h2>
<p>Tạo không gian riêng tư</p>
<button onclick="joinRoom('Riêng tư')">Tham gia</button>
</div>
<div class="room">
<h2>🎤 Karaoke</h2>
<p>Hát cùng bạn bè</p>
<button onclick="joinRoom('Karaoke')">Tham gia</button>
</div>
<div class="room">
<h2>🎮 Trò chơi</h2>
<p>Thử thách vui cùng bạn bè</p>
<button onclick="joinRoom('Trò chơi')">Tham gia</button>
</div>
</div>
</div>
<footer>© 2026 NHẬU ONLINE</footer>
<script>
function joinRoom(room) {
    const name = prompt("Nhập tên của bạn để tham gia phòng:");

    if (!name || !name.trim()) {
        return;
    }

    document.getElementById("room-screen")?.remove();

    const screen = document.createElement("div");
    screen.id = "room-screen";

    screen.style.cssText = `
        position:fixed;
        inset:0;
        z-index:9999;
        background:#10131d;
        color:white;
        padding:25px;
        font-family:Arial,sans-serif;
        text-align:center;
        overflow:auto;
    `;

    screen.innerHTML = `
        <h1 style="color:#fdbb35">
            🍻 ${room}
        </h1>

        <p>Xin chào ${name}!</p>

        <div id="chat-box" style="
            background:#222838;
            border:1px solid #fdbb35;
            border-radius:12px;
            height:55vh;
            max-width:700px;
            margin:20px auto;
            padding:15px;
            overflow-y:auto;
            text-align:left;
        ">
            <p>🍻 Chào mừng bạn đến với ${room}!</p>
        </div>

        <div style="max-width:700px;margin:auto;display:flex;gap:8px">
            <input id="chat-input"
                placeholder="Nhập tin nhắn..."
                style="flex:1;min-width:0;padding:14px;border-radius:8px;border:0">

            <button onclick="sendMessage()">
                Gửi
            </button>
        </div>

        <br>

        <button onclick="
            document.getElementById('room-screen').remove()
        ">
            ← Quay lại trang chủ
        </button>
    `;

    document.body.appendChild(screen);
    window.currentUser = name.trim();
}

function sendMessage() {
    const input = document.getElementById("chat-input");
    const box = document.getElementById("chat-box");

    if (!input || !input.value.trim()) return;

    const message = document.createElement("p");
    message.textContent =
        window.currentUser + ": " + input.value.trim();

    box.appendChild(message);
    input.value = "";
    box.scrollTop = box.scrollHeight;
}
</script>
</body>
</html>
